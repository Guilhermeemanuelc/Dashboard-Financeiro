<!DOCTYPE html>

<html lang="pt-br">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Transação</title>

<link rel="stylesheet" href="estilos/nova-transacao.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>


<main class="nova-transacao-container">

    <div class="cabecalho-transacao">

        <a href="index.html" class="btn-voltar">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h1>Nova Transação</h1>

    </div>


    <section class="formulario-transacao">

        <div class="seletor-tipo">

            <button
                type="button"
                class="tipo-btn ativo"
                data-tipo="receita">

                <i class="fa-solid fa-arrow-up"></i>

                Receita

            </button>


            <button
                type="button"
                class="tipo-btn"
                data-tipo="despesa">

                <i class="fa-solid fa-arrow-down"></i>

                Despesa

            </button>

        </div>


        <form id="form-transacao">

            <div class="campo">

                <label for="descricao">
                    Descrição
                </label>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Salário"
                    required>

            </div>


            <div class="campo">

                <label for="valor">
                    Valor
                </label>

                <input
                    type="number"
                    id="valor"
                    placeholder="0,00"
                    step="0.01"
                    min="0"
                    required>

            </div>


            <div class="campo">

                <label for="categoria">
                    Categoria
                </label>

                <select
                    id="categoria"
                    required>

                    <option value="">
                        Selecione uma categoria
                    </option>

                    <option value="Alimentação">
                        Alimentação
                    </option>

                    <option value="Transporte">
                        Transporte
                    </option>

                    <option value="Moradia">
                        Moradia
                    </option>

                    <option value="Trabalho">
                        Trabalho
                    </option>

                    <option value="Lazer">
                        Lazer
                    </option>

                    <option value="Saúde">
                        Saúde
                    </option>

                    <option value="Outros">
                        Outros
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    required>

            </div>


            <button
                type="button"
                class="btn-salvar"
                id="btn-salvar"
                onclick="salvarTransacao()">

                <i class="fa-solid fa-check"></i>

                Salvar Transação

            </button>

        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/nova-transacao.js"></script>


</body>

</html>
