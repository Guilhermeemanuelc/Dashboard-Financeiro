```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta - Dashboard Financeiro</title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../estilos/mobile.css"
    >

    <!-- Material Icons -->

    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>

<body>

    <main class="login-container">

        <!-- CARD DE CADASTRO -->

        <section class="login-card">

            <!-- LOGO -->

            <div class="login-logo">

                <i class="fa-solid fa-wallet"></i>

            </div>


            <!-- TÍTULO -->

            <div class="login-header">

                <h1>
                    Crie sua conta
                </h1>

                <p>
                    Comece a organizar suas finanças de forma simples.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form id="cadastro-form">

                <!-- NOME -->

                <div class="campo-login">

                    <label for="nome">
                        Nome
                    </label>

                    <div class="input-login">

                        <i class="material-icons">
                            person
                        </i>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- E-MAIL -->

                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-login">

                        <i class="material-icons">
                            email
                        </i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-login">

                        <i class="material-icons">
                            lock
                        </i>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrar-senha"
                            aria-label="Mostrar senha"
                        >

                            <i class="material-icons">
                                visibility
                            </i>

                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo-login">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <div class="input-login">

                        <i class="material-icons">
                            lock_outline
                        </i>

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <!-- MENSAGEM -->

                <div
                    id="mensagem-cadastro"
                    class="mensagem-login"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="btn-cadastrar"
                    class="btn-entrar"
                >

                    <span class="texto-btn">
                        CRIAR CONTA
                    </span>

                    <span
                        class="loading-login"
                        aria-hidden="true"
                    >

                        <i class="fa-solid fa-spinner"></i>

                    </span>

                </button>

            </form>


            <!-- VOLTAR PARA LOGIN -->

            <div class="login-cadastro">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
```
